name: hello_docker_pi
services:
  desktop:
    build:
      context: .
      args:
        - http_proxy
        - https_proxy
    image: hello-docker-pi:local
    container_name: hello_docker
    hostname: hellodocker
    restart: always
    init: true
    environment:
      HELLOBOARD_PROXY_SOCKET: /run/helloboard-proxy/bash-proxy.sock
      no_proxy: "localhost,127.0.0.1,::1"
      NO_PROXY: "localhost,127.0.0.1,::1"
    ports:
      - "127.0.0.1:6080:6080"
      - "${BOARD_BIND:-0.0.0.0}:8090:8090"
    volumes:
      - home:/home/hellodocker
      - ./files:/work:ro
      - type: bind
        source: ${HOME}/.local/share/hello_docker_pi/proxy
        target: /run/helloboard-proxy
        read_only: true
        bind:
          create_host_path: false
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
volumes:
  home:
